name: Fern Client CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck launcher and client
        run: npx tsc --noEmit

      - name: Run Vitest test suite
        run: npm test

      - name: Dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  backend-validation:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Build backend
        run: npm --prefix backend run build

  windows-build-verification:
    name: Windows Build & Distribution Smoke Test
    runs-on: windows-latest
    needs: [test-and-lint, backend-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all components
        run: npm run build

      - name: Package Windows portable distribution
        run: npm run package:win

      - name: Verify release directory artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "release/FernClient-1.0.0-Portable.zip")) {
            Write-Error "Release artifact FernClient-1.0.0-Portable.zip was not generated!"
            exit 1
          }
          if (-not (Test-Path "release/SHA256SUMS.txt")) {
            Write-Error "Checksum manifest SHA256SUMS.txt was not generated!"
            exit 1
          }
          Write-Host "Windows build and packaging verified successfully."
